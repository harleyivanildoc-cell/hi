<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="cadastro-formulario.css">
</head>
<body>

  <div class="marca-pagina">
    <img src="logo principal.png" alt="Logo" class="logo-img">
    <span class="logo-texto"></span> 
  </div>

  <main class="cadastro-container">
    <h2>Criar Nova Conta</h2>
    <p>Preencha os dados abaixo para realizar o seu cadastro.</p>

    <form action="#" method="POST" class="cadastro-form">
      
      <div class="input-grupo">
        <label for="nome">Nome Completo *</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
      </div>

      <div class="input-linha">
        <div class="input-grupo">
          <label for="nascimento">Data de Nascimento</label>
          <input type="date" id="nascimento" name="nascimento">
        </div>

        <div class="input-grupo">
          <label for="naturalidade">Naturalidade</label>
          <input type="text" id="naturalidade" name="naturalidade" placeholder="Cidade/distrito">
        </div>
      </div>

      <div class="input-grupo">
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" placeholder="introduza seu email" required>
      </div>

      <div class="input-grupo">
        <label for="deficiencia">Tipo de Deficiência *</label>
        <select id="deficiencia" name="deficiencia" required>
          <option value="" disabled selected>Selecione uma opção</option>
          <option value="nenhuma">Nenhuma</option>
          <option value="fisica">Física</option>
          <option value="visual">Visual</option>
          <option value="auditiva">Auditiva</option>
          <option value="intelectual">Intelectual / Mental</option>
          <option value="multipla">Múltipla</option>
          <option value="outra">Outra / Não listada</option>
        </select>
      </div>

      <div class="input-grupo">
        <label for="senha">Senha *</label>
        <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" required>
      </div>

      <button type="submit" class="btn-cadastrar">Cadastrar</button>

    </form>
  </main>

</body>
</html>
